# ==========================================================================
# 格间 GEJIAN · 群晖 NAS 部署（纯 HTTP，无 HTTPS / 无 TLS 证书 / 无反向代理）
#
# 目录示例： /volume1/docker/gejian/
# 该目录内放 3 个文件： docker-compose.yml、index.html、nginx.conf
# 浏览器访问： http://<NAS内网IP>:8088
# 外网访问：   路由器把外网 TCP 端口转发到 <NAS内网IP>:8088 即可
#
# 说明：
#  1. 群晖 DSM 自身占用 80/443，所以宿主端口用 8088，容器内仍是 80。
#  2. 直接用官方 nginx 镜像 + 只读挂载，不需要执行 docker build。
#  3. DSM 6 自带的 docker-compose v1 若提示格式错误，在首行加 version: "3.8"。
#  4. 只想传 2 个文件时，可删掉 nginx.conf 那一行挂载（默认 nginx 配置也能跑，
#     但会失去 UTF-8 声明、gzip 和 HTML 禁用缓存）。
# ==========================================================================

services:
  web:
    image: nginx:1.27-alpine
    # 若想改用仓库里的 Dockerfile 自建镜像，把上面一行替换为下面两行：
    #   build: .
    #   image: gejian:local
    restart: unless-stopped

    # 改左边数字即可换宿主端口，例如 "9080:80"；右边 80 不要动
    ports:
      - "8088:80"

    # 更新页面：覆盖项目目录里的 index.html 即可（nginx.conf 已对 HTML 关闭缓存）；
    # 若覆盖后浏览器仍是旧版，执行 docker compose restart 重新挂载即可。
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    environment:
      - TZ=Asia/Shanghai

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
